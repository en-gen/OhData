name: CI

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

# Supersede an in-flight run when the same PR is pushed again: the older run is answering a
# question nobody is asking any more, and CI/CodeQL/k6 are the three most expensive workflows
# here. Scoped to pull_request on purpose: a run on develop or main establishes that branch's
# baseline - coverage and Test Analytics, CodeQL alerts, the commit status a release reads - so
# it must always finish. PR and push runs land in different groups anyway, since github.ref is
# refs/pull/N/merge for one and refs/heads/X for the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0   # skip git hook installation in CI

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # GitVersion needs full history

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore src/OhData.sln

      # Whitespace only, and --no-restore because the step above already restored.
      #
      # `dotnet format` without a subcommand runs whitespace + style + analyzers, and the last
      # two are already enforced one step later: src/Directory.Build.props sets
      # EnforceCodeStyleInBuild=true and TreatWarningsAsErrors=true, so every IDE/CA rule at
      # warning severity is a BUILD error - and warning is exactly the severity floor
      # `dotnet format style` itself defaults to, so the two check the same set. Measured on
      # this tree: a block-scoped namespace (IDE0161, `:warning` in .editorconfig) fails
      # `dotnet build` with `error IDE0161`, while trailing whitespace builds clean with 0
      # warnings and is caught only here. Whitespace is the sole additive part.
      #
      # Cost, measured locally: full 55s, whitespace 19s (style alone 50s, analyzers 45s -
      # they overlap because each pays the same workspace load). CI's full run was 95s.
      #
      # Residual: a style rule Roslyn exposes to the format CLI but not to the compiler would
      # now go unchecked in CI. The husky pre-commit hook still runs the FULL `dotnet format`
      # locally, so that gap is only reachable by a commit made with --no-verify or through
      # the GitHub web editor. Restore the old behaviour by deleting the `whitespace` word.
      - name: Format check
        run: dotnet format whitespace src/OhData.sln --verify-no-changes --no-restore

      - name: Build
        id: build
        run: dotnet build src/OhData.sln --no-restore -c Release

      # samples/ is NOT in src/OhData.sln, so nothing here compiled it -- and it silently stopped
      # compiling at #581, which changed every handler signature. It is shipped documentation: a
      # sample that does not build teaches an API that does not exist. Built separately rather than
      # added to the solution so it stays out of the packable/test surface (and off Codecov).
      - name: Build samples (not in the solution; see #656)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet build samples/OhData.Sample.EfCoreSqlite/OhData.Sample.EfCoreSqlite.csproj -c Release

      # One step per suite, each `!cancelled()`, so a failure in one does not hide the other six.
      # As a single `run:` block, bash `set -e` aborted at the first failing suite and Codecov
      # received only that suite's results - losing exactly the data Test Analytics exists to
      # collect, on exactly the runs that need it. Any failing step still fails the job; the
      # `steps.build.outcome` half keeps all seven skipped when the build never produced binaries,
      # rather than restating one build failure as seven test failures.
      - name: "Test: OhData.AspNetCore.Tests"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          dotnet test src/OhData.AspNetCore.Tests/OhData.AspNetCore.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --logger "junit;LogFilePath=$GITHUB_WORKSPACE/TestResults/{assembly}.junit.xml" \
            --results-directory ./coverage

      - name: "Test: OhData.Client.Tests"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          dotnet test src/OhData.Client.Tests/OhData.Client.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --logger "junit;LogFilePath=$GITHUB_WORKSPACE/TestResults/{assembly}.junit.xml" \
            --results-directory ./coverage

      - name: "Test: OhData.MicrosoftODataClient.Tests"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          dotnet test src/OhData.MicrosoftODataClient.Tests/OhData.MicrosoftODataClient.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --logger "junit;LogFilePath=$GITHUB_WORKSPACE/TestResults/{assembly}.junit.xml" \
            --results-directory ./coverage

      - name: "Test: OhData.AspNetCore.OpenApi.Tests"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          dotnet test src/OhData.AspNetCore.OpenApi.Tests/OhData.AspNetCore.OpenApi.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --logger "junit;LogFilePath=$GITHUB_WORKSPACE/TestResults/{assembly}.junit.xml" \
            --results-directory ./coverage

      - name: "Test: OhData.AspNetCore.NSwag.Tests"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          dotnet test src/OhData.AspNetCore.NSwag.Tests/OhData.AspNetCore.NSwag.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --logger "junit;LogFilePath=$GITHUB_WORKSPACE/TestResults/{assembly}.junit.xml" \
            --results-directory ./coverage

      - name: "Test: OhData.AspNetCore.Swashbuckle.Tests"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          dotnet test src/OhData.AspNetCore.Swashbuckle.Tests/OhData.AspNetCore.Swashbuckle.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --logger "junit;LogFilePath=$GITHUB_WORKSPACE/TestResults/{assembly}.junit.xml" \
            --results-directory ./coverage

      - name: "Test: OhData.TestBench.AspNetCore.Tests"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          dotnet test src/OhData.TestBench.AspNetCore.Tests/OhData.TestBench.AspNetCore.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --logger "junit;LogFilePath=$GITHUB_WORKSPACE/TestResults/{assembly}.junit.xml" \
            --results-directory ./coverage

      # Codecov Test Analytics: per-test pass/fail history, flaky-test detection, and a PR
      # comment naming the tests a PR broke. Uploads the JUnit XML the seven suites above
      # wrote (JunitXml.TestLogger, referenced by all seven test projects).
      #
      # Carries the same condition as the suites above, for the same reason: a run whose tests
      # FAILED is exactly the run whose results are worth having, so a failing suite must not
      # skip this - while a build that produced no binaries leaves nothing to upload.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          directory: ./TestResults
          fail_ci_if_error: false

      - name: Pack (dry run)
        run: |
          dotnet pack src/OhData.AspNetCore/OhData.AspNetCore.csproj \
            --no-build -c Release \
            -p:Version="0.0.0-ci" \
            -o ./nupkg-ci
          dotnet pack src/OhData.Client/OhData.Client.csproj \
            --no-build -c Release \
            -p:Version="0.0.0-ci" \
            -o ./nupkg-ci
          dotnet pack src/OhData.AspNetCore.Swashbuckle/OhData.AspNetCore.Swashbuckle.csproj \
            --no-build -c Release \
            -p:Version="0.0.0-ci" \
            -o ./nupkg-ci
          dotnet pack src/OhData.AspNetCore.OpenApi/OhData.AspNetCore.OpenApi.csproj \
            --no-build -c Release \
            -p:Version="0.0.0-ci" \
            -o ./nupkg-ci
          dotnet pack src/OhData.AspNetCore.NSwag/OhData.AspNetCore.NSwag.csproj \
            --no-build -c Release \
            -p:Version="0.0.0-ci" \
            -o ./nupkg-ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          fail_ci_if_error: false
