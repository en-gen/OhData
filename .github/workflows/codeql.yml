name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly full scan every Monday at 03:00 UTC
    - cron: '0 3 * * 1'

# Supersede an in-flight run when the same PR is pushed again: the older run is answering a
# question nobody is asking any more, and CI/CodeQL/k6 are the three most expensive workflows
# here. Scoped to pull_request on purpose: a run on develop or main establishes that branch's
# baseline - coverage and Test Analytics, CodeQL alerts, the commit status a release reads - so
# it must always finish. PR and push runs land in different groups anyway, since github.ref is
# refs/pull/N/merge for one and refs/heads/X for the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.8
        with:
          languages: csharp
          queries: security-extended

      - name: Restore
        run: dotnet restore src/OhData.sln

      - name: Build
        run: dotnet build src/OhData.sln --no-restore -c Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.8
        with:
          category: "/language:csharp"
